spring.application.name=Simba_CTD
server.port=8082
server.address=0.0.0.0

# Charge les paramètres locaux sans imposer de secret dans le dépôt.
spring.config.import=optional:file:.env[.properties]

# Gemini / assistant IA
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# KEYCLOAK / OAUTH2 RESOURCE SERVER
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/simba-ctd


# POSTGRESQL
spring.datasource.url=jdbc:postgresql://localhost:5433/Simba_DB
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.repair-check-sum=true
spring.flyway.enabled=true
